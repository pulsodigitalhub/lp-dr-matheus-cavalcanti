    <style>
      :root {
        color-scheme: light;
        --ink: #202117;
        --muted: #6d6c63;
        --olive: #393b23;
        --cream: #f6f3eb;
        --line: rgba(32, 33, 23, 0.1);
        --whatsapp: #25d366;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          radial-gradient(circle at 50% 44%, rgba(57, 59, 35, 0.08), transparent 46%),
          var(--cream);
        color: var(--ink);
        font-family: Inter, Arial, sans-serif;
      }

      .redirect-card {
        width: min(100%, 430px);
        padding: 36px 30px 30px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 24px 60px rgba(32, 33, 23, 0.12);
        text-align: center;
      }

      .loader {
        position: relative;
        width: 116px;
        height: 116px;
        margin: 0 auto 26px;
        display: grid;
        place-items: center;
      }

      .loader svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .loader circle {
        fill: none;
        stroke-width: 6;
      }

      .loader .track {
        stroke: rgba(37, 211, 102, 0.16);
      }

      .loader .progress {
        stroke: var(--whatsapp);
        stroke-linecap: round;
        stroke-dasharray: 276.46;
        stroke-dashoffset: 276.46;
        transition: stroke-dashoffset 80ms linear;
      }

      .whatsapp-mark {
        width: 68px;
        height: 68px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: var(--whatsapp);
        color: white;
        box-shadow: 0 16px 30px rgba(37, 211, 102, 0.28);
      }

      .whatsapp-mark svg {
        position: static;
        transform: none;
        width: 34px;
        height: 34px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--olive);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.04;
        letter-spacing: 0;
      }

      p {
        margin: 14px auto 26px;
        max-width: 300px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.55;
      }

      button {
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 0;
        background: var(--olive);
        color: white;
        font: 700 15px/1 Arial, sans-serif;
        cursor: pointer;
      }

      .brand {
        display: block;
        margin-top: 24px;
        color: rgba(32, 33, 23, 0.44);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      <h1>Direcionando para a equipe</h1>
      <p>Conectando você ao atendimento do Dr. Matheus Cavalcanti...</p>
      <button type="button" id="manual-button">Conectar agora</button>
      <span class="brand">Dr. Matheus Cavalcanti · Ortopedia</span>
    </main>

    <script>
      const progress = document.querySelector('.progress')
      const button = document.querySelector('#manual-button')
      const duration = 2500
      const startedAt = Date.now()
      let redirected = false

      function buildRedirectUrl() {
        const params = new URLSearchParams(window.location.search)
        const whatsappUrl = new URL('https://tintim.link/whatsapp/8ecd6b81-7447-41c1-ab41-56c76e44cfd5/c281f571-2564-42f2-bb8f-8745e005da88')

        params.forEach((value, key) => {
          whatsappUrl.searchParams.set(key, value)
        })

        if (!whatsappUrl.searchParams.has('landing_page_url')) {
          const fallbackPath = window.location.pathname.replace(/agendar\/?$/, '')
          whatsappUrl.searchParams.set('landing_page_url', window.location.origin + fallbackPath)
        }

        whatsappUrl.searchParams.set('mensagem', 'Olá! Quero saber mais informações.')
        return whatsappUrl.toString()
      }

      function redirectNow() {
        if (redirected) return
        redirected = true
        window.location.href = buildRedirectUrl()
      }

      button.addEventListener('click', redirectNow)

      window.dataLayer = window.dataLayer || []
      window.dataLayer.push({
        event: 'whatsapp_redirect_page',
        page_location: window.location.href,
      })

      const timer = window.setInterval(() => {
        const amount = Math.min((Date.now() - startedAt) / duration, 1)
        progress.style.strokeDashoffset = String(276.46 * (1 - amount))

        if (amount >= 1) {
          window.clearInterval(timer)
          redirectNow()
        }
      }, 30)
    </script>
